apiVersion: v1
kind: List
metadata:
  name: fullstack-app
  description: "Full stack application with frontend, backend, and database"
items:
# Database (PostgreSQL)
- apiVersion: v1
  kind: Secret
  metadata:
    name: postgres-secret
  type: Opaque
  data:
    username: cG9zdGdyZXM=  # postgres (base64)
    password: cGFzc3dvcmQ=  # password (base64)

- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: postgres-pvc
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: postgres
    labels:
      app: postgres
      tier: database
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: postgres
    template:
      metadata:
        labels:
          app: postgres
          tier: database
      spec:
        containers:
        - name: postgres
          image: postgres:13-alpine
          ports:
          - containerPort: 5432
          env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: username
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: password
          - name: POSTGRES_DB
            value: "appdb"
          volumeMounts:
          - name: postgres-storage
            mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
        volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

- apiVersion: v1
  kind: Service
  metadata:
    name: postgres-service
    labels:
      app: postgres
  spec:
    type: ClusterIP
    ports:
    - port: 5432
      targetPort: 5432
    selector:
      app: postgres

# Backend API
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: backend-config
  data:
    DATABASE_URL: "postgresql://postgres:password@postgres-service:5432/appdb"
    NODE_ENV: "production"
    PORT: "3000"

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: backend-api
    labels:
      app: backend-api
      tier: backend
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: backend-api
    template:
      metadata:
        labels:
          app: backend-api
          tier: backend
      spec:
        containers:
        - name: backend-api
          image: node:18-alpine
          ports:
          - containerPort: 3000
          envFrom:
          - configMapRef:
              name: backend-config
          command: ["node"]
          args: ["server.js"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

- apiVersion: v1
  kind: Service
  metadata:
    name: backend-service
    labels:
      app: backend-api
  spec:
    type: ClusterIP
    ports:
    - port: 3000
      targetPort: 3000
    selector:
      app: backend-api

# Frontend
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: frontend
    labels:
      app: frontend
      tier: frontend
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: frontend
    template:
      metadata:
        labels:
          app: frontend
          tier: frontend
      spec:
        containers:
        - name: frontend
          image: nginx:1.21-alpine
          ports:
          - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/conf.d
        volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: nginx-config
  data:
    default.conf: |
      server {
          listen 80;
          server_name localhost;
          
          location / {
              root /usr/share/nginx/html;
              index index.html index.htm;
              try_files $uri $uri/ /index.html;
          }
          
          location /api/ {
              proxy_pass http://backend-service:3000/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

- apiVersion: v1
  kind: Service
  metadata:
    name: frontend-service
    labels:
      app: frontend
  spec:
    type: ClusterIP
    ports:
    - port: 80
      targetPort: 80
    selector:
      app: frontend

- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: fullstack-ingress
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
  spec:
    tls:
    - hosts:
      - myapp.example.com
      secretName: myapp-tls
    rules:
    - host: myapp.example.com
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-service
              port:
                number: 80