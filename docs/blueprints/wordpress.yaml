apiVersion: v1
kind: List
metadata:
  name: wordpress-mysql
  description: "WordPress with MySQL database and persistent storage"
items:
# MySQL Database
- apiVersion: v1
  kind: Secret
  metadata:
    name: mysql-secret
  type: Opaque
  data:
    root-password: cm9vdHBhc3N3b3Jk  # rootpassword (base64)
    database: d29yZHByZXNz  # wordpress (base64)
    username: d29yZHByZXNz  # wordpress (base64)
    password: d29yZHByZXNzcGFzcw==  # wordpresspass (base64)

- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: mysql-pvc
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: mysql
    labels:
      app: mysql
      tier: database
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: mysql
    strategy:
      type: Recreate
    template:
      metadata:
        labels:
          app: mysql
          tier: database
      spec:
        containers:
        - name: mysql
          image: mysql:8.0
          ports:
          - containerPort: 3306
          env:
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: root-password
          - name: MYSQL_DATABASE
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: database
          - name: MYSQL_USER
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: username
          - name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: password
          volumeMounts:
          - name: mysql-storage
            mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
              - mysqladmin
              - ping
              - -h
              - localhost
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
              - mysqladmin
              - ping
              - -h
              - localhost
            initialDelaySeconds: 5
            periodSeconds: 5
        volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc

- apiVersion: v1
  kind: Service
  metadata:
    name: mysql-service
    labels:
      app: mysql
  spec:
    type: ClusterIP
    ports:
    - port: 3306
      targetPort: 3306
    selector:
      app: mysql

# WordPress
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: wordpress-pvc
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: wordpress
    labels:
      app: wordpress
      tier: frontend
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: wordpress
    template:
      metadata:
        labels:
          app: wordpress
          tier: frontend
      spec:
        containers:
        - name: wordpress
          image: wordpress:6.3-apache
          ports:
          - containerPort: 80
          env:
          - name: WORDPRESS_DB_HOST
            value: "mysql-service:3306"
          - name: WORDPRESS_DB_NAME
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: database
          - name: WORDPRESS_DB_USER
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: username
          - name: WORDPRESS_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: password
          - name: WORDPRESS_CONFIG_EXTRA
            value: |
              define('WP_REDIS_HOST', 'redis-service');
              define('WP_REDIS_PORT', 6379);
          volumeMounts:
          - name: wordpress-storage
            mountPath: /var/www/html
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /wp-admin/install.php
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /wp-admin/install.php
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
        volumes:
        - name: wordpress-storage
          persistentVolumeClaim:
            claimName: wordpress-pvc

- apiVersion: v1
  kind: Service
  metadata:
    name: wordpress-service
    labels:
      app: wordpress
  spec:
    type: ClusterIP
    ports:
    - port: 80
      targetPort: 80
    selector:
      app: wordpress

# Redis for WordPress caching (optional)
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: redis
    labels:
      app: redis
      tier: cache
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: redis
    template:
      metadata:
        labels:
          app: redis
          tier: cache
      spec:
        containers:
        - name: redis
          image: redis:7-alpine
          ports:
          - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

- apiVersion: v1
  kind: Service
  metadata:
    name: redis-service
  spec:
    type: ClusterIP
    ports:
    - port: 6379
      targetPort: 6379
    selector:
      app: redis

# Ingress
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: wordpress-ingress
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
  spec:
    tls:
    - hosts:
      - myblog.example.com
      secretName: wordpress-tls
    rules:
    - host: myblog.example.com
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: wordpress-service
              port:
                number: 80