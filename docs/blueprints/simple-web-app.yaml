apiVersion: v1
kind: List
metadata:
  name: simple-web-app
  description: "Simple web application with deployment and service"
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: web-app
    labels:
      app: web-app
      tier: frontend
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: web-app
    template:
      metadata:
        labels:
          app: web-app
          tier: frontend
      spec:
        containers:
        - name: web-app
          image: nginx:1.21-alpine
          ports:
          - containerPort: 80
            name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

- apiVersion: v1
  kind: Service
  metadata:
    name: web-app-service
    labels:
      app: web-app
  spec:
    type: ClusterIP
    ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    selector:
      app: web-app

- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: web-app-ingress
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
  spec:
    rules:
    - host: web-app.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: web-app-service
              port:
                number: 80