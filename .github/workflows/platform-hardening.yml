name: Platform Hardening

on:
  push:
    branches: [main, autostack-golden-state]
    paths:
      - 'AutoStack/pocketbase/**'
  pull_request:
    branches: [main]
    paths:
      - 'AutoStack/pocketbase/**'

jobs:
  build-and-vet:
    name: Build and Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AutoStack/pocketbase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: AutoStack/pocketbase/go.mod
          cache: true
      - name: Build all packages
        run: go build ./...
      - name: Vet
        run: go vet ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-and-vet
    defaults:
      run:
        working-directory: AutoStack/pocketbase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: AutoStack/pocketbase/go.mod
          cache: true
      - name: Run all tests
        run: go test ./... -count=1 -timeout=300s
      - name: Run tests with race detector
        run: go test ./pkg/security/... ./pkg/chaos/... ./pkg/metrics/... ./pkg/persistence/... -race -count=1

  replay-determinism:
    name: Replay Determinism
    runs-on: ubuntu-latest
    needs: build-and-vet
    defaults:
      run:
        working-directory: AutoStack/pocketbase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: AutoStack/pocketbase/go.mod
          cache: true
      - name: Verify replay determinism
        run: go test ./pkg/replay/... -v -run TestReplay -count=3
      - name: Verify certification hash stability
        run: go test ./pkg/certification/... -v -run TestVerify -count=3

  append-only-validation:
    name: Append-Only Invariant
    runs-on: ubuntu-latest
    needs: build-and-vet
    defaults:
      run:
        working-directory: AutoStack/pocketbase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: AutoStack/pocketbase/go.mod
          cache: true
      - name: Validate append-only invariants
        run: go test ./pkg/persistence/... -v -run TestAppend -count=1
      - name: Validate duplicate put rejection
        run: go test ./pkg/persistence/... -v -run TestDuplicate -count=1

  security-hardening:
    name: Security Hardening
    runs-on: ubuntu-latest
    needs: build-and-vet
    defaults:
      run:
        working-directory: AutoStack/pocketbase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: AutoStack/pocketbase/go.mod
          cache: true
      - name: Run security package tests
        run: go test ./pkg/security/... -v -count=1
      - name: Run chaos validation tests
        run: go test ./pkg/chaos/... -v -count=1
      - name: Verify no credentials in logs (grep check)
        run: |
          # Fail if any production Go file logs a variable named 'secret', 'password', or 'token'
          # using fmt.Println (forbidden per CLAUDE.md).
          if grep -r 'fmt\.Println' --include='*.go' \
            --exclude='*_test.go' \
            --exclude-dir='.git' \
            --exclude-dir='vendor' \
            .; then
            echo "FAIL: fmt.Println found in production code"
            exit 1
          fi
          echo "PASS: no fmt.Println in production code"

  benchmarks:
    name: Benchmarks (regression guard)
    runs-on: ubuntu-latest
    needs: build-and-vet
    defaults:
      run:
        working-directory: AutoStack/pocketbase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: AutoStack/pocketbase/go.mod
          cache: true
      - name: Run benchmarks (smoke run)
        run: go test ./pkg/benchmarks/... -bench=. -benchmem -benchtime=1x -timeout=120s

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build platform-api image
        run: |
          docker build \
            -f AutoStack/pocketbase/deploy/docker/Dockerfile.platform-api \
            -t autostack-platform-api:ci \
            AutoStack/pocketbase
      - name: Verify image runs healthcheck
        run: |
          cid=$(docker run -d -p 18090:8090 autostack-platform-api:ci)
          sleep 3
          status=$(docker inspect --format='{{.State.Status}}' "$cid")
          docker stop "$cid" || true
          docker rm "$cid" || true
          if [ "$status" != "running" ] && [ "$status" != "exited" ]; then
            echo "FAIL: container status: $status"
            exit 1
          fi
          echo "PASS: container started successfully"
