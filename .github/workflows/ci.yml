name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./pocketbase

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: pocketbase/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: pocketbase
          args: --timeout=5m

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
        env:
          CGO_ENABLED: 1

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./pocketbase/coverage.out
          flags: backend
          fail_ci_if_error: false

      - name: Build binary
        run: go build -o autostack-server ./...
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  terraform-validate:
    name: Terraform Templates
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform format check
        run: terraform fmt -check -recursive ./pocketbase/templates/

      - name: Validate ecs-web-app template
        working-directory: ./pocketbase/templates
        run: |
          cat > ecs-web-app-test.tf << 'EOF'
          terraform {
            required_version = ">= 1.0"
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 5.0"
              }
            }
          }
          provider "aws" {
            region = "us-east-1"
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
          }
          EOF
          terraform init -backend=false
          terraform validate

      - name: Validate full-stack template
        working-directory: ./pocketbase/templates
        run: |
          cat > full-stack-test.tf << 'EOF'
          terraform {
            required_version = ">= 1.0"
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 5.0"
              }
            }
          }
          provider "aws" {
            region = "us-east-1"
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
          }
          EOF
          terraform init -backend=false
          terraform validate

      - name: Validate static-site template
        working-directory: ./pocketbase/templates
        run: |
          cat > static-site-test.tf << 'EOF'
          terraform {
            required_version = ">= 1.0"
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 5.0"
              }
            }
          }
          provider "aws" {
            region = "us-east-1"
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
          }
          EOF
          terraform init -backend=false
          terraform validate

  docker-build:
    name: Docker Build (no push)
    runs-on: ubuntu-22.04
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (PR — no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=pr-${{ github.event.number }}
            BUILD_COMMIT=${{ github.sha }}
