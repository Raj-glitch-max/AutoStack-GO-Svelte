run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - noctx
    - sqlclosecheck
  disable:
    - exhaustruct
    - wrapcheck
    - exhaustive

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/Raj-glitch-max/AutoStack-GO-Svelte

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 50
  max-same-issues: 10
