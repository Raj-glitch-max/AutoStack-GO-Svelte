---
# AutoStack Execution Runtime
# Hosts: policy runtime, workflow engine, execution task lifecycle
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autostack-runtime
  namespace: autostack
  labels:
    app.kubernetes.io/name: autostack-runtime
    app.kubernetes.io/component: execution-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autostack-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autostack-runtime
        app.kubernetes.io/component: execution-runtime
    spec:
      serviceAccountName: autostack-runtime
      containers:
        - name: runtime
          image: autostack/runtime:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTOSTACK_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: autostack-config
                  key: tenant-id
            - name: AUTOSTACK_WAL_DIR
              value: /data/wal
            - name: AUTOSTACK_ARCHIVE_DIR
              value: /data/archive
          volumeMounts:
            - name: wal-storage
              mountPath: /data/wal
            - name: archive-storage
              mountPath: /data/archive
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: wal-storage
          persistentVolumeClaim:
            claimName: autostack-wal-pvc
        - name: archive-storage
          persistentVolumeClaim:
            claimName: autostack-archive-pvc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autostack-runtime
  namespace: autostack
