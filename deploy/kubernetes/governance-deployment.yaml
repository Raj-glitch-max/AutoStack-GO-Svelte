---
# AutoStack Governance Runtime
# Hosts: policy enforcement, approval queue, confidence assessment, escalation tracking
# Replicas: 1 (governance runtime is single-owner per tenant)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autostack-governance
  namespace: autostack
  labels:
    app.kubernetes.io/name: autostack-governance
    app.kubernetes.io/component: governance-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autostack-governance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autostack-governance
        app.kubernetes.io/component: governance-runtime
    spec:
      serviceAccountName: autostack-runtime
      containers:
        - name: governance
          image: autostack/governance:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTOSTACK_SNAPSHOT_INTERVAL_SEC
              value: "60"
            - name: AUTOSTACK_APPROVAL_EXPIRY_SEC
              value: "3600"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
