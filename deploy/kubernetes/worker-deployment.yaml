---
# AutoStack Worker Pool
# Hosts: deterministic task execution workers
# Workers register via WorkerRegistry and emit heartbeats.
# DO NOT scale below 1 without draining open task assignments first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autostack-workers
  namespace: autostack
  labels:
    app.kubernetes.io/name: autostack-workers
    app.kubernetes.io/component: worker-fabric
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: autostack-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autostack-workers
        app.kubernetes.io/component: worker-fabric
    spec:
      serviceAccountName: autostack-runtime
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: autostack/worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTOSTACK_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AUTOSTACK_HEARTBEAT_INTERVAL_SEC
              value: "15"
            - name: AUTOSTACK_DRAIN_TIMEOUT_SEC
              value: "45"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
