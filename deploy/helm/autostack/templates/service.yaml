apiVersion: v1
kind: Service
metadata:
  name: autostack-runtime
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: autostack-runtime
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: autostack-runtime
